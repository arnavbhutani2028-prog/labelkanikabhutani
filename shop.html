<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/style.css"><link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🪷</text></svg>"><title>Shop · {BRAND}</title></head>
<body data-page="shop">
<div class="page-head"><div class="wrap"><h1>The Collection</h1><p>Lehengas, sarees, gowns & bridal jewellery</p></div></div>
<div class="wrap shop">
  <aside class="filters">
    <h4>Category</h4><div id="f-cat"></div>
    <h4>Occasion</h4><select id="f-event" aria-label="Occasion"></select>
    <h4>Colour</h4><div id="f-family"></div>
    <h4>Budget</h4><input type="range" id="f-max" min="5000" max="100000" step="5000" value="100000" aria-label="Maximum price"><span id="max-label"></span>
  </aside>
  <div>
    <div class="toolbar"><span id="count"></span>
      <select id="f-sort" aria-label="Sort"><option value="featured">Featured</option><option value="low">Price: low to high</option><option value="high">Price: high to low</option></select></div>
    <div class="grid" id="grid"></div>
  </div>
</div>
<script src="assets/products.js"></script><script src="assets/app.js"></script></body></html>
